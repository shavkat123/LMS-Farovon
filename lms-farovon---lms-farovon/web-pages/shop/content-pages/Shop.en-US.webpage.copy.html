<div class="row sectionBlockLayout" style="display: flex; flex-wrap: wrap; padding: 8px; margin: 0px;">
  <div class="container" style="display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; min-width: 300px; display: flex; flex-direction: column;">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <h2 style="margin: 0;">Магазин</h2>
        <div class="card" style="border-radius: 20px; border: 1px solid #0078d4; padding: 8px 20px; background: #e8f4fd;">
          <span style="font-size: 14px; color: #0078d4; font-weight: 600;">
            <i class="bi bi-star-fill" style="color: #f39c12;"></i> Ваши баллы: <span id="user-points">0</span>
          </span>
        </div>
      </div>

      <!-- Категории -->
      <div style="display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;">
        <button class="btn btn-sm btn-primary shop-cat active" data-cat="all" style="border-radius: 20px;">Все</button>
        <button class="btn btn-sm btn-outline-secondary shop-cat" data-cat="merch" style="border-radius: 20px;">Мерч</button>
        <button class="btn btn-sm btn-outline-secondary shop-cat" data-cat="experience" style="border-radius: 20px;">Опыт</button>
        <button class="btn btn-sm btn-outline-secondary shop-cat" data-cat="days" style="border-radius: 20px;">Дни</button>
      </div>

      <div class="row g-3" id="shop-grid">

        <div class="col-md-6 col-lg-4 shop-item" data-cat="merch">
          <div class="card h-100" style="border-radius: 12px; border: 1px solid #e1e4e8; overflow: hidden;">
            <div style="height: 120px; background: linear-gradient(135deg, #e8f4fd, #c3daf6); display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-bag" style="font-size: 3rem; color: #0078d4;"></i>
            </div>
            <div style="padding: 16px;">
              <h6 style="margin-bottom: 6px;">Фирменная толстовка Farovon</h6>
              <p style="font-size: 12px; color: #888; margin-bottom: 12px;">Брендированная одежда компании</p>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; color: #f39c12;"><i class="bi bi-star-fill"></i> 500 баллов</span>
                <button class="btn btn-sm btn-primary" style="border-radius: 8px;" onclick="redeemItem(this, 500)">Обменять</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-4 shop-item" data-cat="experience">
          <div class="card h-100" style="border-radius: 12px; border: 1px solid #e1e4e8; overflow: hidden;">
            <div style="height: 120px; background: linear-gradient(135deg, #f0fff4, #c3efd3); display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-award" style="font-size: 3rem; color: #27ae60;"></i>
            </div>
            <div style="padding: 16px;">
              <h6 style="margin-bottom: 6px;">Обед с руководителем</h6>
              <p style="font-size: 12px; color: #888; margin-bottom: 12px;">Неформальная встреча с директором</p>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; color: #f39c12;"><i class="bi bi-star-fill"></i> 1000 баллов</span>
                <button class="btn btn-sm btn-primary" style="border-radius: 8px;" onclick="redeemItem(this, 1000)">Обменять</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-4 shop-item" data-cat="days">
          <div class="card h-100" style="border-radius: 12px; border: 1px solid #e1e4e8; overflow: hidden;">
            <div style="height: 120px; background: linear-gradient(135deg, #fff3e0, #ffd99e); display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-calendar-heart" style="font-size: 3rem; color: #e67e22;"></i>
            </div>
            <div style="padding: 16px;">
              <h6 style="margin-bottom: 6px;">Дополнительный выходной день</h6>
              <p style="font-size: 12px; color: #888; margin-bottom: 12px;">Один оплачиваемый день отпуска</p>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; color: #f39c12;"><i class="bi bi-star-fill"></i> 2000 баллов</span>
                <button class="btn btn-sm btn-primary" style="border-radius: 8px;" onclick="redeemItem(this, 2000)">Обменять</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-4 shop-item" data-cat="merch">
          <div class="card h-100" style="border-radius: 12px; border: 1px solid #e1e4e8; overflow: hidden;">
            <div style="height: 120px; background: linear-gradient(135deg, #fce4ec, #f8bbd0); display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-cup-hot" style="font-size: 3rem; color: #e74c3c;"></i>
            </div>
            <div style="padding: 16px;">
              <h6 style="margin-bottom: 6px;">Фирменная кружка</h6>
              <p style="font-size: 12px; color: #888; margin-bottom: 12px;">Брендированная кружка Farovon</p>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; color: #f39c12;"><i class="bi bi-star-fill"></i> 200 баллов</span>
                <button class="btn btn-sm btn-primary" style="border-radius: 8px;" onclick="redeemItem(this, 200)">Обменять</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
function redeemItem(btn, cost) {
  var pts = parseInt(document.getElementById('user-points').textContent) || 0;
  if (pts < cost) {
    alert('Недостаточно баллов. У вас ' + pts + ' из ' + cost + ' необходимых.');
    return;
  }
  if (confirm('Обменять ' + cost + ' баллов на этот товар?')) {
    document.getElementById('user-points').textContent = pts - cost;
    btn.textContent = 'Заказан';
    btn.disabled = true;
    btn.className = 'btn btn-sm btn-success';
  }
}

document.querySelectorAll('.shop-cat').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.shop-cat').forEach(function(b) {
      b.classList.remove('btn-primary', 'active'); b.classList.add('btn-outline-secondary');
    });
    this.classList.add('btn-primary', 'active'); this.classList.remove('btn-outline-secondary');
    var cat = this.dataset.cat;
    document.querySelectorAll('.shop-item').forEach(function(item) {
      item.style.display = (cat === 'all' || item.dataset.cat === cat) ? '' : 'none';
    });
  });
});
</script>
