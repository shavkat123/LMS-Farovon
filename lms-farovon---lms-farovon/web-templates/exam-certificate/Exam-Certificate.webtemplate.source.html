{% comment %}
  Сертификат (/certificate?id=<id>) — для просмотра и печати на одном листе A4.

  Отозванный или истёкший сертификат показываем крупной плашкой прямо на листе, а не просто
  подписью: распечатка без отметки выглядела бы как действующая.
{% endcomment %}

<style>
  .exc-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  .exc-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .exc-btn { border: 0; border-radius: 10px; background: #15803D; color: #fff; font-weight: 600; padding: 10px 18px; cursor: pointer; }
  .exc-link { color: #334155; }

  .exc-sheet { position: relative; background: #fff; border: 1px solid #E2E8F0; border-radius: 6px;
               aspect-ratio: 297 / 210; padding: 6% 8%; display: flex; flex-direction: column;
               justify-content: space-between; overflow: hidden; }
  .exc-frame { position: absolute; inset: 14px; border: 2px solid #15803D; border-radius: 4px; pointer-events: none; }
  .exc-brand { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #15803D; font-weight: 700; }
  .exc-title { font-size: 40px; font-weight: 800; color: #0F172A; margin: 10px 0 0; }
  .exc-lead { color: #64748B; margin: 18px 0 6px; font-size: 16px; }
  .exc-name { font-size: 34px; font-weight: 700; color: #0F172A; margin: 0; }
  .exc-what { color: #334155; font-size: 17px; line-height: 1.5; margin: 14px 0 0; }
  .exc-foot { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; color: #334155; font-size: 14px; }
  .exc-foot strong { display: block; color: #0F172A; font-size: 15px; }

  .exc-stamp { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg);
               border: 4px solid #B91C1C; color: #B91C1C; font-size: 40px; font-weight: 800;
               padding: 6px 28px; border-radius: 8px; text-transform: uppercase; opacity: .85; background: rgba(255,255,255,.7); }

  .exc-err { color: #B91C1C; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; padding: 12px 14px; }
  .exc-center { text-align: center; color: #64748B; padding: 60px 20px; }

  @media (max-width: 640px) {
    .exc-sheet { aspect-ratio: auto; min-height: 420px; padding: 32px 24px; }
    .exc-title { font-size: 28px; }
    .exc-name { font-size: 24px; }
  }

  /* Печать: только лист, без шапки сайта, меню и кнопок */
  @media print {
    @page { size: A4 landscape; margin: 0; }
    body * { visibility: hidden !important; }
    .exc-sheet, .exc-sheet * { visibility: visible !important; }
    .exc-sheet { position: fixed; inset: 0; border: 0; border-radius: 0; aspect-ratio: auto; width: 100%; height: 100%; }
  }
</style>

<div class="exc-wrap">
  <div class="exc-toolbar">
    <a class="exc-link" href="/certification">← К аттестации</a>
    <button class="exc-btn" id="excPrint" style="display:none">Распечатать</button>
  </div>
  <div id="excRoot" class="exc-center">Загружаем сертификат…</div>
</div>

<script>
(function () {
  'use strict';

  var CERT_ID = (function () {
    var m = /[?&]id=([^&]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  })();
  var CERT = { active: 100000000, expired: 100000001, revoked: 100000002 };

  var root = document.getElementById('excRoot');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function api(url) {
    return fetch(url, { headers: { Accept: 'application/json' }, credentials: 'same-origin' }).then(function (r) { return r.json(); });
  }
  // Дата-только хранится без времени — показываем как есть, без сдвига пояса.
  function day(v) {
    if (!v) { return '—'; }
    var p = String(v).slice(0, 10).split('-');
    var months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    return parseInt(p[2], 10) + ' ' + months[parseInt(p[1], 10) - 1] + ' ' + p[0] + ' г.';
  }

  if (!CERT_ID) {
    root.className = '';
    root.innerHTML = '<div class="exc-err">Не указан сертификат.</div>';
    return;
  }

  api("/_api/new_certifications(" + CERT_ID + ")?$select=new_certificationid,new_name,new_status,new_issuedon," +
      "new_validuntil,new_revokereason,_new_contact_value,_new_exam_value")
    .then(function (c) {
      if (c.error) { throw new Error('сертификат не найден или недоступен'); }
      return Promise.all([
        c,
        api("/_api/contacts(" + c._new_contact_value + ")?$select=fullname"),
        api("/_api/new_exams(" + c._new_exam_value + ")?$select=new_name")
      ]);
    })
    .then(function (res) {
      var c = res[0], person = res[1], exam = res[2];

      // Истечение проверяем и здесь: ночной поток переводит в «Истёк» раз в сутки,
      // а распечатать могут в тот же день, когда срок уже прошёл.
      var expiredByDate = c.new_validuntil && String(c.new_validuntil).slice(0, 10) < new Date().toISOString().slice(0, 10);
      var stamp = '';
      if (c.new_status === CERT.revoked) { stamp = 'Отозван'; }
      else if (c.new_status === CERT.expired || expiredByDate) { stamp = 'Срок истёк'; }

      var html = '<div class="exc-sheet">';
      html += '<div class="exc-frame"></div>';
      html += '<div><div class="exc-brand">Фаровон · Академия</div><h1 class="exc-title">Сертификат</h1></div>';
      html += '<div><p class="exc-lead">подтверждает, что</p>';
      html += '<p class="exc-name">' + esc(person.fullname || 'Сотрудник') + '</p>';
      html += '<p class="exc-what">успешно прошёл(ла) аттестацию «' + esc(exam.new_name || 'Экзамен') + '»</p></div>';
      html += '<div class="exc-foot">' +
              '<div>Номер<strong>' + esc(c.new_name) + '</strong></div>' +
              '<div>Выдан<strong>' + day(c.new_issuedon) + '</strong></div>' +
              '<div>Действует до<strong>' + day(c.new_validuntil) + '</strong></div>' +
              '</div>';
      if (stamp) {
        html += '<div class="exc-stamp">' + stamp + '</div>';
      }
      html += '</div>';

      if (c.new_status === CERT.revoked && c.new_revokereason) {
        html += '<p style="color:#64748B;margin-top:12px">Причина отзыва: ' + esc(c.new_revokereason) + '</p>';
      }

      root.className = '';
      root.innerHTML = html;

      var printBtn = document.getElementById('excPrint');
      if (!stamp) {
        printBtn.style.display = '';
        printBtn.addEventListener('click', function () { window.print(); });
      }
    })
    .catch(function (e) {
      root.className = '';
      root.innerHTML = '<div class="exc-err">Не удалось открыть сертификат: ' + esc(e.message) + '</div>';
    });
})();
</script>
