<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="primary / success / danger / outline / ghost · sm md lg" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Components · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 500; border-radius: var(--radius-md); border: 0; cursor: pointer; transition: background-color 200ms; padding: 8px 16px; font-size: 16px; font-family: var(--font-sans); }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-success { background: var(--color-success); color: #fff; }
  .btn-danger { background: #DC2626; color: #fff; }
  .btn-outline { background: transparent; color: var(--color-primary); border: 2px solid var(--color-primary); padding: 6px 14px; }
  .btn-outline:hover { background: #EFF6FF; }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-ghost:hover { background: var(--color-gray-100); color: var(--color-gray-900); }
  .btn-sm { padding: 6px 12px; font-size: 14px; }
  .btn-lg { padding: 12px 24px; font-size: 18px; }
  .lbl { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500; min-width: 56px; }
</style></head>
<body>
  <div class="row"><div class="lbl">Variant</div>
    <button class="btn btn-primary">Enroll Now</button>
    <button class="btn btn-success">Mark complete</button>
    <button class="btn btn-danger">Delete</button>
    <button class="btn btn-outline">View details</button>
    <button class="btn btn-ghost">Cancel</button>
  </div>
  <div class="row"><div class="lbl">Size</div>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
    <button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed">Loading…</button>
  </div>
</body></html>
