<!doctype html>
<!-- @dsCard group="Type" name="Type Specimen" subtitle="Roboto · 400 / 500 / 700 / 900" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Type · Specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-sans); }
  .specimen { font-size: 96px; font-weight: 900; line-height: 1; color: var(--color-gray-900); letter-spacing: -0.04em; }
  .meta { display: flex; gap: 24px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-1); }
  .meta div { font-size: 12px; color: var(--fg-3); }
  .meta b { display: block; color: var(--fg-1); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .weights { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
  .w { font-size: 22px; color: var(--fg-1); }
</style></head>
<body>
  <div class="specimen">Aa Bb 123</div>
  <div class="weights">
    <span class="w" style="font-weight:400">Regular 400</span>
    <span class="w" style="font-weight:500">Medium 500</span>
    <span class="w" style="font-weight:700">Bold 700</span>
    <span class="w" style="font-weight:900">Black 900</span>
  </div>
  <div class="meta">
    <div><b>Roboto</b>Google Fonts</div>
    <div><b>Sans-only</b>No serif, no display face</div>
    <div><b>Mono</b>ui-monospace · for tabular numbers</div>
  </div>
</body></html>
