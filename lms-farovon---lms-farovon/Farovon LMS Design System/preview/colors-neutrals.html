<!doctype html>
<!-- @dsCard group="Colors" name="Neutral Scale" subtitle="Tailwind gray 50 → 900" viewport="700x130" -->
<html><head><meta charset="utf-8"><title>Colors · Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .sw { border-radius: 4px; overflow: hidden; border: 1px solid var(--border-1); }
  .sw .chip { height: 56px; }
  .sw .meta { padding: 4px 6px; }
  .sw .name { font-size: 10px; font-weight: 600; color: var(--fg-1); }
  .sw .hex { font-size: 9px; color: var(--fg-3); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#F8F9FA"></div><div class="meta"><div class="name">50</div><div class="hex">F8F9FA</div></div></div>
    <div class="sw"><div class="chip" style="background:#F1F3F5"></div><div class="meta"><div class="name">100</div><div class="hex">F1F3F5</div></div></div>
    <div class="sw"><div class="chip" style="background:#E9ECEF"></div><div class="meta"><div class="name">200</div><div class="hex">E9ECEF</div></div></div>
    <div class="sw"><div class="chip" style="background:#DEE2E6"></div><div class="meta"><div class="name">300</div><div class="hex">DEE2E6</div></div></div>
    <div class="sw"><div class="chip" style="background:#ADB5BD"></div><div class="meta"><div class="name">400</div><div class="hex">ADB5BD</div></div></div>
    <div class="sw"><div class="chip" style="background:#6C757D"></div><div class="meta"><div class="name">500</div><div class="hex">6C757D</div></div></div>
    <div class="sw"><div class="chip" style="background:#495057"></div><div class="meta"><div class="name">600</div><div class="hex">495057</div></div></div>
    <div class="sw"><div class="chip" style="background:#343A40"></div><div class="meta"><div class="name">700</div><div class="hex">343A40</div></div></div>
    <div class="sw"><div class="chip" style="background:#212529"></div><div class="meta"><div class="name">800</div><div class="hex">212529</div></div></div>
    <div class="sw"><div class="chip" style="background:#111827"></div><div class="meta"><div class="name">900</div><div class="hex">111827</div></div></div>
  </div>
</body></html>
