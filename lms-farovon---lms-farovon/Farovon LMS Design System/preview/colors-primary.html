<!doctype html>
<!-- @dsCard group="Colors" name="Primary Colors" subtitle="#007BFF blue — the product action color" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Colors · Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-1); }
  .sw .chip { height: 64px; }
  .sw .meta { padding: 8px 10px; }
  .sw .name { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .sw .hex { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); margin-top: 2px; }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#EFF6FF"></div><div class="meta"><div class="name">primary-50</div><div class="hex">#EFF6FF</div></div></div>
    <div class="sw"><div class="chip" style="background:#DBEAFE"></div><div class="meta"><div class="name">primary-100</div><div class="hex">#DBEAFE</div></div></div>
    <div class="sw"><div class="chip" style="background:#007BFF"></div><div class="meta"><div class="name">primary</div><div class="hex">#007BFF</div></div></div>
    <div class="sw"><div class="chip" style="background:#0056B3"></div><div class="meta"><div class="name">primary-hover</div><div class="hex">#0056B3</div></div></div>
    <div class="sw"><div class="chip" style="background:#2563EB"></div><div class="meta"><div class="name">primary-600</div><div class="hex">#2563EB</div></div></div>
    <div class="sw"><div class="chip" style="background:#1E40AF"></div><div class="meta"><div class="name">primary-800</div><div class="hex">#1E40AF</div></div></div>
  </div>
</body></html>
