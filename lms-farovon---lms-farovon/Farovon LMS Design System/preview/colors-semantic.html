<!doctype html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success / warning / danger / points + tinted backgrounds" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Colors · Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-1); }
  .sw .chip { height: 60px; }
  .sw .meta { padding: 8px 10px; }
  .sw .name { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .sw .hex { font-size: 10px; color: var(--fg-3); font-family: var(--font-mono); margin-top: 2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .pair .chip:first-child { height: 60px; }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#28A745"></div><div class="meta"><div class="name">success</div><div class="hex">#28A745</div></div></div>
    <div class="sw"><div class="chip" style="background:#F59E0B"></div><div class="meta"><div class="name">warning</div><div class="hex">#F59E0B</div></div></div>
    <div class="sw"><div class="chip" style="background:#DC2626"></div><div class="meta"><div class="name">danger</div><div class="hex">#DC2626</div></div></div>
    <div class="sw"><div class="chip" style="background:#FBBF24"></div><div class="meta"><div class="name">points ⭐</div><div class="hex">#FBBF24</div></div></div>
    <div class="sw"><div class="chip" style="background:#DCFCE7"></div><div class="meta"><div class="name">success-100</div><div class="hex">#DCFCE7</div></div></div>
    <div class="sw"><div class="chip" style="background:#FEF3C7"></div><div class="meta"><div class="name">warning-100</div><div class="hex">#FEF3C7</div></div></div>
    <div class="sw"><div class="chip" style="background:#FEE2E2"></div><div class="meta"><div class="name">danger-100</div><div class="hex">#FEE2E2</div></div></div>
    <div class="sw"><div class="chip" style="background:#FEF9C3"></div><div class="meta"><div class="name">points-bg</div><div class="hex">#FEF9C3</div></div></div>
  </div>
</body></html>
