<!doctype html>
<!-- @dsCard group="UI Kit — Web App V2" name="Web App UI Kit v2 (Corporate)" subtitle="Equeo-inspired warm corporate redesign — widgets, learning paths, RU" viewport="1440x900" -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Farovon LMS v2 — Corporate</title>
<meta name="viewport" content="width=1440">
<meta name="ext-resource-dependency" content="../../assets/farovon-logo.png" data-resource-id="logo" />
<link rel="icon" href="../../assets/farovon-logo.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="v2.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: var(--v2-bg-app); color: var(--v2-fg-1); margin: 0; -webkit-font-smoothing: antialiased; }
  /* Hide tailwind preflight that nukes our list-style — we override inline anyway */
  ol, ul { padding: 0; margin: 0; list-style: none; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<template id="__bundler_thumbnail" data-bg-color="#1E3A8A">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1E3A8A"/>
    <rect x="430" y="300" width="340" height="120" rx="24" fill="#ffffff"/>
    <text x="600" y="378" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">FAROVON</text>
    <text x="600" y="470" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#C7D2E8" text-anchor="middle" letter-spacing="6">LEARNING HUB</text>
  </svg>
</template>

<body class="v2-body">
<div id="root"></div>

<script type="text/babel" src="SidebarV2.jsx"></script>
<script type="text/babel" src="TopBarV2.jsx"></script>
<script type="text/babel" src="Widgets.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="CourseDetail.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const user = { name: 'Aziz Karimov', role: 'EMPLOYEE' };
  const [active, setActive] = React.useState('dashboard');
  const [courseOpen, setCourseOpen] = React.useState(false);

  React.useEffect(() => { window.lucide?.createIcons(); });

  const openCourse = () => { setCourseOpen(true); setActive('courses'); };
  const closeCourse = () => setCourseOpen(false);

  let main;
  if (courseOpen)                 main = <CourseDetailV2 onBack={closeCourse} />;
  else if (active === 'dashboard') main = <DashboardV2 user={user} onNav={setActive} onOpenCourse={openCourse} />;
  else if (active === 'courses')  main = <CoursesV2 onOpen={openCourse} />;
  else if (active === 'forum')    main = <ForumV2 />;
  else if (active === 'shop')     main = <ShopV2 />;
  else if (active === 'paths')    main = <PathsV2 />;
  else main = (
    <div className="p-12 text-center max-w-2xl mx-auto">
      <h2 style={{ fontSize: 22, fontWeight: 800, marginTop: 12 }}>Раздел в разработке</h2>
      <p style={{ fontSize: 14, color: 'var(--v2-fg-2)', marginTop: 6 }}>В этом UI-ките показаны: Главная, Курсы, Деталь курса, Траектории, Сообщество, Магазин.</p>
    </div>
  );

  return (
    <div className="flex h-screen overflow-hidden" data-screen-label={`Farovon v2 — ${courseOpen ? 'course-detail' : active}`}>
      <SidebarV2 active={active} onNav={(k) => { setCourseOpen(false); setActive(k); }} points={1250} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <TopBarV2 user={user} />
        <main className="flex-1 overflow-y-auto p-8">{main}</main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
