<!doctype html>
<!-- @dsCard group="UI Kit — Admin" name="Admin Console UI Kit" subtitle="Корпоративная админка: Дашборд, Сотрудники, Редактор курса, Аналитика" viewport="1440x900" -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Farovon LMS — Admin Console</title>
<meta name="viewport" content="width=1440">
<link rel="icon" href="../../assets/farovon-logo.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; }
  ol, ul { padding: 0; margin: 0; list-style: none; }
  input[type="checkbox"] { accent-color: var(--adm-primary); width: 14px; height: 14px; }
</style>
</head>
<body class="adm-body">
<div id="root"></div>

<script type="text/babel" src="AdminSidebar.jsx"></script>
<script type="text/babel" src="AdminTopBar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Users.jsx"></script>
<script type="text/babel" src="CourseEditor.jsx"></script>
<script type="text/babel" src="Analytics.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const [active, setActive] = React.useState('dashboard');
  React.useEffect(() => { window.lucide?.createIcons(); });

  const screens = {
    dashboard: { title: 'Дашборд',          breadcrumb: ['Обзор', 'Дашборд'],          render: () => <AdminDashboard /> },
    analytics: { title: 'Аналитика',        breadcrumb: ['Обзор', 'Аналитика'],        render: () => <AdminAnalytics /> },
    users:     { title: 'Сотрудники',       breadcrumb: ['Люди', 'Сотрудники'],         render: () => <AdminUsers /> },
    courses:   { title: 'Безопасность на рабочем месте', breadcrumb: ['Контент', 'Курсы', 'Редактирование'], render: () => <CourseEditor />,
                 actions: <></> },
  };
  const screen = screens[active] || {
    title: active.charAt(0).toUpperCase() + active.slice(1),
    breadcrumb: [active],
    render: () => (
      <div className="p-12 text-center">
        <i data-lucide="construction" style={{ width: 48, height: 48, color: 'var(--adm-fg-3)' }} />
        <h2 style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Раздел в разработке</h2>
        <p style={{ fontSize: 13, color: 'var(--adm-fg-2)', marginTop: 6 }}>Демо-кит покрывает: Дашборд, Аналитику, Сотрудников и Редактор курса.</p>
      </div>
    ),
  };

  return (
    <div className="flex h-screen overflow-hidden" data-screen-label={`Admin — ${active}`}>
      <AdminSidebar active={active} onNav={setActive} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <AdminTopBar title={screen.title} breadcrumb={screen.breadcrumb} actions={screen.actions} />
        <main className="flex-1 overflow-y-auto p-6">{screen.render()}</main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
