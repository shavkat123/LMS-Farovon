# Создание и правка уроков H5P для персонала.
#
# Без этой записи форма «Загрузить урок» отвечает «You don't have the appropriate
# permissions»: в среде на new_h5pcontent было только H5P Content Read (чтение для всех),
# а права на create не было ни у кого — загрузить урок не мог даже администратор.
#
# Роль Руководитель включена намеренно: пункт «Загрузить урок» показывается ему в меню,
# и без права он получал бы отказ на странице, которую сам же видит.
#
# Append/AppendTo нужны, чтобы привязать урок к курсу (new_relatedcourse) и к автору
# загрузки (new_uploadedby).
adx_accountrelationship:
adx_append: true
adx_appendto: true
adx_contactrelationship:
adx_create: true
adx_delete: true
adx_entitylogicalname: new_h5pcontent
adx_entityname: H5P Content Write
adx_entitypermission_webrole:
- 3b5fe5f3-a538-f111-88b5-7ced8d76b3cc
- a1b2c3d4-1111-2222-3333-000000000001
- a1b2c3d4-1111-2222-3333-000000000002
- a1b2c3d4-1111-2222-3333-000000000003
adx_entitypermissionid: e213b84e-d30d-43f9-b727-e8bc483fd1e4
adx_parententitypermission:
adx_parentrelationship:
adx_read: true
adx_scope: 756150000
adx_write: true
