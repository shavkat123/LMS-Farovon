- 2ccfddf9-a538-f111-88b5-7ced8d76b3cc
adx_entitypermissionid: b2c3d4e5-f6a7-4b89-9c01-200000000002
adx_parententitypermission:
adx_parentrelationship:
adx_read: true
adx_scope: 756150001
adx_write: false
