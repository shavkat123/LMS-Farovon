# Право намеренно оставлено ВЫКЛЮЧЕННЫМ (statecode 1): таблицу feedback в портале никто не читает
# и не пишет — стартовая basic form 'simple contact us form' и страница /contact-us тоже
# деактивированы, а живая страница /user-feedback чисто клиентская (ничего не сохраняет),
# и пары Webapi/feedback/* в sitesetting.yml нет. Включать Global-право без потребителя —
# это открыть чтение всех обращений впустую, поэтому активацию делаем только вместе с формой.
# Заодно сняты write/delete и роль Anonymous: если право когда-нибудь включат, оно не окажется
# сразу широко открытым — форме обращения хватает create + read.
