# Права на запись сняты: экрана администрирования мероприятий нет, new_event нигде не пишется
# (только чтение через FetchXML на /events и главной), а Web API для new_event не включён —
# в sitesetting.yml нет пар Webapi/new_event/enabled и Webapi/new_event/fields.
# Держать create/write/delete включёнными без единого потребителя — лишняя поверхность атаки.
# Если админ-экран мероприятий появится, вернуть флаги вместе с записями Webapi/new_event/*.
adx_append: true
adx_appendto: true
adx_create: false
adx_delete: false
adx_entitylogicalname: new_event
adx_entityname: Event Admin Manage
adx_entitypermission_webrole:
- 3b5fe5f3-a538-f111-88b5-7ced8d76b3cc
- a1b2c3d4-1111-2222-3333-000000000001
- a1b2c3d4-1111-2222-3333-000000000002
- a1b2c3d4-1111-2222-3333-000000000003
adx_entitypermissionid: a1b2c3d4-3333-4444-5555-000000000003
adx_read: true
adx_scope: 756150000
adx_write: false
