# Scope Contact: пользователь читает и пишет ТОЛЬКО свой прогресс.
# Схемное имя связи new_h5pprogress -> contact по полю new_user подтверждено в Power Apps
# (Таблицы -> H5P Progress -> Связи -> многие-к-одному -> Contact -> «Имя отношения»).
#
# Чтение чужого прогресса намеренно НЕ отбирается совсем: лидерборд и блок лидеров на главной
# агрегируют прогресс всех сотрудников и видны каждому. Под это заведено отдельное право
# H5P-Progress-Read-All — Global, только чтение. Запись при этом закрыта, и накрутить чужой
# прогресс через PATCH /_api/new_h5pprogresses(id) больше нельзя.
#
# ОСТАЁТСЯ ОТКРЫТЫМ: свой собственный прогресс пользователь всё ещё может подделать
# (PATCH new_completion=true, new_scorescaled=1 = +150 монет за урок), потому что плеер пишет
# результат с клиента. Лечится только переносом начисления в Power Automate — тогда adx_write
# снимается совсем. Тот же класс задачи, что и оформление покупки в магазине.
