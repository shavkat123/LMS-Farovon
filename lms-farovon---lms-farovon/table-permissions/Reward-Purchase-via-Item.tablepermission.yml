# ДЕАКТИВИРОВАНО (statecode 1). Это дочернее право давало запись в ЧУЖИЕ покупки:
# scope Parental, а родитель — Reward Item Read (Global read на весь каталог наград для всех ролей).
# То есть «через любую награду, которую я вижу» открывался read+write+create на связанные с ней
# покупки, включая чужие. Дыра в экономике баллов: чужое списание можно было обнулить.
#
# Право не удалено из репозитория намеренно: pac paportal upload НЕ удаляет из среды записи,
# пропавшие с диска. Удаление файла оставило бы дыру живой на портале и при этом убрало бы её
# из репозитория — то есть спрятало бы проблему, а не решило. Деактивация же реально доезжает
# до среды при следующем upload.
