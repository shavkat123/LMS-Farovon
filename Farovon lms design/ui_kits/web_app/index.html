<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Farovon LMS — Web App UI Kit</title>
<meta name="viewport" content="width=1440">
<link rel="icon" href="../../assets/farovon-logo.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="v2.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: var(--v2-bg-app); color: var(--v2-fg-1); margin: 0; -webkit-font-smoothing: antialiased; }
  ol, ul { padding: 0; margin: 0; list-style: none; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="v2-body">
<div id="root"></div>

<script type="text/babel" src="SidebarV2.jsx"></script>
<script type="text/babel" src="TopBarV2.jsx"></script>
<script type="text/babel" src="Widgets.jsx"></script>
<script type="text/babel" src="ScreensV2.jsx"></script>
<script type="text/babel" src="CourseDetail.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const user = { name: 'Aziz Karimov', role: 'EMPLOYEE' };
  const [active, setActive] = React.useState('dashboard');
  const [courseOpen, setCourseOpen] = React.useState(false);

  React.useEffect(() => { window.lucide?.createIcons(); });

  const openCourse = () => { setCourseOpen(true); setActive('courses'); };
  const closeCourse = () => setCourseOpen(false);

  let main;
  if (courseOpen)                main = <CourseDetailV2 onBack={closeCourse} />;
  else if (active === 'dashboard') main = <DashboardV2 user={user} onNav={setActive} onOpenCourse={openCourse} />;
  else if (active === 'courses')  main = <CoursesV2 onOpen={openCourse} />;
  else if (active === 'forum')    main = <ForumV2 />;
  else if (active === 'shop')     main = <ShopV2 />;
  else if (active === 'paths')    main = <PathsV2 />;
  else main = (
    <div className="p-12 text-center max-w-2xl mx-auto">
      <div style={{ fontSize: 64 }}>🚧</div>
      <h2 style={{ fontSize: 22, fontWeight: 800, marginTop: 12 }}>Раздел в разработке</h2>
      <p style={{ fontSize: 14, color: 'var(--v2-fg-2)', marginTop: 6 }}>В этом UI-ките показаны: Главная, Курсы, Деталь курса, Траектории, Сообщество, Магазин.</p>
    </div>
  );

  return (
    <div className="flex h-screen overflow-hidden" data-screen-label={`Farovon — ${courseOpen ? 'course-detail' : active}`}>
      <SidebarV2 active={active} onNav={(k) => { setCourseOpen(false); setActive(k); }} points={1250} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <TopBarV2 user={user} />
        <main className="flex-1 overflow-y-auto p-8">{main}</main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
