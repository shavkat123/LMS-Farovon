<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border-bottom: 0; }
  .tag { font: 700 11px/1 var(--font-mono); color: var(--fg-3); text-align: right; padding-top: 6px; }
  .smp { color: var(--fg-1); font-family: var(--font-sans); }
</style></head>
<body>
  <div class="row"><div class="tag">36 / 900</div><div class="smp" style="font: 900 36px/1.1 var(--font-sans); font-variant-numeric: tabular-nums;">1,250</div></div>
  <div class="row"><div class="tag">30 / 700</div><div class="smp" style="font: 700 30px/1.2 var(--font-sans);">Welcome back, Aziz!</div></div>
  <div class="row"><div class="tag">24 / 800</div><div class="smp" style="font: 800 24px/1.2 var(--font-sans);">Sign in to FAROVON</div></div>
  <div class="row"><div class="tag">20 / 700</div><div class="smp" style="font: 700 20px/1.3 var(--font-sans);">Mandatory Training</div></div>
  <div class="row"><div class="tag">18 / 600</div><div class="smp" style="font: 600 18px/1.4 var(--font-sans);">Onboarding for new hires</div></div>
  <div class="row"><div class="tag">16 / 400</div><div class="smp" style="font: 400 16px/1.5 var(--font-sans);">Continue your development path to unlock more skills.</div></div>
  <div class="row"><div class="tag">14 / 500</div><div class="smp" style="font: 500 14px/1.4 var(--font-sans); color: var(--fg-2);">Dashboard · Courses · Forum</div></div>
  <div class="row"><div class="tag">12 / 400</div><div class="smp" style="font: 400 12px/1.4 var(--font-sans); color: var(--fg-3);">Due: 12 Mar 2026 · 60% complete</div></div>
</body></html>
