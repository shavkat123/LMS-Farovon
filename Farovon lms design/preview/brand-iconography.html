<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; align-items: center; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; border-radius: 6px; }
  .ic svg { color: var(--fg-2); }
  .ic .lbl { font-size: 10px; color: var(--fg-3); font-family: var(--font-mono); }
  .ic.active { background: #EFF6FF; }
  .ic.active svg { color: var(--color-primary); }
  .note { margin-top: 14px; font-size: 11px; color: var(--fg-3); line-height: 1.5; }
</style></head>
<body>
  <div class="row">
    <div class="ic active"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span class="lbl">home</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4V4z"/></svg><span class="lbl">book</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14v3a5 5 0 01-4 4.9V14h2v3H7v-3h2v-2.1A5 5 0 015 7V4zm-3 1h2v2a3 3 0 003 3v-1A2 2 0 014 7V5z"/></svg><span class="lbl">trophy</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18l-2 7H5L3 3zm2 9h14v9H5z"/></svg><span class="lbl">store</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="4"/><circle cx="17" cy="9" r="3"/><path d="M2 20a7 7 0 0114 0H2zm14-3a5 5 0 016 3h-6"/></svg><span class="lbl">users</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3z"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg><span class="lbl">chart-bar</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v3H3zm2 5h14v9H5z"/></svg><span class="lbl">comments</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 21h6v-2H9v2zm3-19a7 7 0 00-4 12.7V18h8v-3.3A7 7 0 0012 2z"/></svg><span class="lbl">lightbulb</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/></svg><span class="lbl">bell</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="6"/><path d="M21 21l-5-5"/></svg><span class="lbl">search</span></div>
    <div class="ic" style="color:#FBBF24"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FBBF24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg><span class="lbl">star ⭐</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="6"/><path d="M9 14h6l-1.5 8L12 19l-1.5 3z"/></svg><span class="lbl">medal</span></div>
    <div class="ic" style="color:#B45309"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none"/></svg><span class="lbl">clock</span></div>
    <div class="ic" style="color:#DC2626"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 7v6m0 3v.01"/></svg><span class="lbl">warn</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0H4z"/></svg><span class="lbl">user</span></div>
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 15a7.5 7.5 0 000-6l2-1-2-3.4-2.3 1a7.5 7.5 0 00-5.2-3l-.4-2.6h-3l-.4 2.6a7.5 7.5 0 00-5.2 3l-2.3-1-2 3.4 2 1a7.5 7.5 0 000 6l-2 1 2 3.4 2.3-1a7.5 7.5 0 005.2 3l.4 2.6h3l.4-2.6a7.5 7.5 0 005.2-3l2.3 1 2-3.4-2-1zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg><span class="lbl">settings</span></div>
  </div>
  <p class="note">Source: <code>react-icons/fa</code> + <code>lucide-react</code>. The kit standardises on Lucide; production parity uses <code>react-icons/fa</code>. The ⭐ glyph is the only emoji in the product chrome (gamification points).</p>
</body></html>
