<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · Tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 70px 1fr 60px; align-items: center; gap: 12px; }
  .name { font-size: 11px; color: var(--fg-1); font-family: var(--font-mono); }
  .bar { height: 14px; background: var(--color-primary); border-radius: 2px; }
  .px { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="row">
    <div class="step"><div class="name">space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
    <div class="step"><div class="name">space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
    <div class="step"><div class="name">space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
    <div class="step"><div class="name">space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
    <div class="step"><div class="name">space-5</div><div class="bar" style="width:20px"></div><div class="px">20px · card padding</div></div>
    <div class="step"><div class="name">space-6</div><div class="bar" style="width:24px"></div><div class="px">24px · section gap</div></div>
    <div class="step"><div class="name">space-8</div><div class="bar" style="width:32px"></div><div class="px">32px · banner padding</div></div>
    <div class="step"><div class="name">space-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
  </div>
</body></html>
